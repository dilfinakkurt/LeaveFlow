default: &default
  adapter: <%= ENV["DATABASE_URL"].present? ? "postgresql" : "sqlite3" %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV["DATABASE_URL"].present? ? "leave_flow_development" : "storage/development.sqlite3" %>

test:
  <<: *default
  database: <%= ENV["DATABASE_URL"].present? ? "leave_flow_test" : "storage/test.sqlite3" %>

production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
